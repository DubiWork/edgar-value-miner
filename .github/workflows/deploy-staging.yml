name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install functions deps
        run: cd functions && npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FMP_API_KEY: ${{ secrets.VITE_FMP_API_KEY }}
          VITE_FUNCTIONS_BASE_URL: https://us-central1-edgar-value-miner.cloudfunctions.net
          VITE_SEC_TICKERS_PROXY_URL: https://us-central1-edgar-value-miner.cloudfunctions.net/secTickers
          VITE_SEC_USER_AGENT: ${{ secrets.VITE_SEC_USER_AGENT }}
          VITE_FEATURE_AI_DEBATE: ${{ secrets.VITE_FEATURE_AI_DEBATE }}
          VITE_FEATURE_PERSONAL_NOTES: ${{ secrets.VITE_FEATURE_PERSONAL_NOTES }}
          VITE_FEATURE_SOCIAL_SHARING: ${{ secrets.VITE_FEATURE_SOCIAL_SHARING }}
          VITE_FEATURE_UPGRADE_CTA: ${{ secrets.VITE_FEATURE_UPGRADE_CTA }}
      - name: Deploy to Firebase Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          target: staging
          projectId: edgar-value-miner
          channelId: live
      - name: Build Cloud Functions
        run: cd functions && npm run build
      - name: Deploy Cloud Functions to Staging
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ runner.temp }}/gcloud.json
          npx firebase deploy --only functions --project edgar-value-miner --force

  e2e-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for staging deploy
        run: sleep 30
      - name: Run e2e on staging
        run: npx playwright test e2e/regression/ --reporter=github
        env:
          BASE_URL: https://edgar-value-miner-staging.web.app
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-results
          path: playwright-report/
